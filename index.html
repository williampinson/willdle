<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willdle</title>
    <links
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="./assets/styles/styles.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <header>
      <h1>WILLDLE</h1>
      <div id="game-header-button-div">
        <button id="button-reset" class="game-header-button">
          &#8634; Reset
        </button>
        <button id="button-stats" class="game-header-button">
          &#9776; Stats
        </button>
        <button id="button-settings" class="game-header-button">
          &#9881; Settings
        </button>
      </div>
    </header>
    <main>
      <div id="game">
        <div id="game-message">
          <p id="game-loading" class="hidden">Loading. Getting word.</p>
          <p id="results-message"></p>
        </div>
        <div id="game-grid-container">
          <div id="game-grid"></div>
        </div>
        <div id="keyboard-container">
          <div id="keyboard"></div>
        </div>
      </div>
    </main>

    <!-- #region Stats Dialog -->
    <div id="stats-dialog" class="dialog">
      <h3 id="stats-header" class="dialog-header">Stats</h3>
      <button id="stats-close" class="close-button">&times;</button>
      <table id="stats-table"></table>
    </div>
    <!-- #endregion -->

    <!-- #region Settings Dialog -->
    <div id="settings-dialog" class="dialog">
      <h3 id="settings-header" class="dialog-header">Settings</h3>
      <button id="settings-close" class="close-button">&times;</button>
      <form id="settings-form">
        <!-- Word Length -->
        <label for="slider-word-length" id="lbl-slider-word-length"
          >Word Length</label
        >
        <div id="settings-slider-1" class="slider-group">
          <input
            id="slider-word-length"
            type="range"
            min="3"
            max="12"
            value="5"
            disabled
          />
          <label
            id="lbl-slider-word-length-value"
            for="slider-word-length"
            class="slider-value"
          ></label>
        </div>

        <!-- Max Attempts -->
        <label for="slider-max-attempts" id="lbl-slider-max-attempts"
          >Number of Guesses</label
        >
        <div id="settings-slider-2" class="slider-group">
          <input
            id="slider-max-attempts"
            type="range"
            min="1"
            max="15"
            value="6"
            disabled
          />
          <label
            id="lbl-slider-max-attempts-value"
            for="slider-word-length"
            class="slider-value"
          ></label>
        </div>
        <!-- <div id="hard-words-mode-container">
          <input type="checkbox" id="checkbox-hard-words-mode" />
          <label
            for="checkbox-hard-words-mode"
            title="The target word is more likely to be difficult to solve.&#013;Note: deselecting this option will currently only affect 5 letter words."
            >Harder Words Mode</label
          >
        </div> -->

        <p>Note: adjusting attempts and word lengths is currently disabled.</p>
        <div id="settings-button-container">
          <button
            id="btn-settings-default"
            class="settings-button"
            type="button"
          >
            Default
          </button>
          <button id="btn-save-settings" class="settings-button" type="submit">
            Save Settings
          </button>
        </div>
        <div></div>
      </form>
    </div>
    <!-- #endregion -->

    <footer>
      <script type="module" src="./assets/scripts/main.js"></script>
      <script type="module" src="./assets/scripts/settings.js"></script>
    </footer>
  </body>
</html>
